<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>MERN LAYOUT1</title>
        <style type="text/css">
            *{
                border: 0px;
                margin: 0px;
                box-sizing:border-box;
            }
            .main{
                width:80%;
                margin: auto;
            }
            .logo{
                width: 100%;
                background-color:lightgray;
                min-height: 80px; 
                line-height: 80px;
                margin-bottom: 10px;
                margin-top: 10px;
                padding-left: 20px;
      
            }
            .navigation{
                width: 100%;
                background-color:lightgray;
                margin-bottom: 10px;
                min-height: 40px;
                line-height: 40px;
                text-align: center;           
            }
            .header{
                width: 100%;
                background-color:lightgray;
                margin-bottom: 10px;
                min-height: 150px; 
                line-height: 150px; 
                text-align: center;          
            }
            .parent{
                width: 100%;
                min-height: 400px;
                display: flex;
                flex-direction: row;
                margin-bottom: 10px;
                gap:20px;
            }
            .sidebar{
                width: 30%;
                background-color:lightgray;
                min-height: 400px;
                line-height: 400px;
                text-align: center;
            }
            .body{
                width: 70%;
                background-color:lightgray;
                min-height: 400px; 
                line-height: 400px;
                text-align: center;    
            }
            .footer{
                width: 100%;
                background-color:lightgray;
                margin-bottom: 10px;
                min-height: 40px;
                line-height: 40px;
                text-align: center;
            }
        </style>    
    </head>
    <body>
        <div class="main">
            <div class="logo">
                <h2>Logo</h2>
            </div>
            <div class="navigation">
                <h2>Navigation</h2>
            </div>
            <div class="header">
                <h2>Header/Banner</h2>
            </div>
            <div class="parent">
                <div class="sidebar">
                    <h2>Sidebar</h2>
                </div>
                <div class="body">
                    <h2>Body Area</h2>
                </div>
            </div>
            <div class="footer">
                <h2>Footer</h2>
            </div>
        </div>
    </body>
</html>
