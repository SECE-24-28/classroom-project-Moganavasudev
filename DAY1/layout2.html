<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>MERN LAYOUT2</title>
        <style type="text/css">
            *{
                border: 0px;
                margin: 0px;
                box-sizing:border-box;
            }
            .main{
                width:80%;
                margin: auto;
            }
            .parent{
                width: 100%;
                min-height: 80px;
                display: flex;
                flex-direction: row;
                margin-bottom: 10px;
                margin-top: 10px;
            }
            .logo{
                width: 60%;
                background-color:lightgray;
                min-height: 80px; 
                line-height: 80px;
                padding-left: 20px;
      
            }
            .navigation{
                width: 40%;
                background-color:lightgray;
                min-height: 80px;
                line-height: 80px;           
            }
            .header{
                width: 100%;
                background-color:lightgray;
                margin-bottom: 10px;
                min-height: 150px; 
                line-height: 150px; 
                text-align: center;          
            }
            .intro{
                width: 100%;
                background-color:lightgray;
                margin-bottom: 10px;
                min-height: 100px; 
                line-height: 100px; 
                text-align: center;          
            }
            .parent1{
                width: 100%;
                min-height: 350px;
                display: flex;
                flex-direction: row;
                margin-bottom: 10px;
                gap:20px;
            }
            .box1{
                width: 33%;
                background-color:lightgray;
                min-height: 350px;
                line-height: 350px;
                text-align: center;
            }
            .box2{
                width: 33%;
                background-color:lightgray;
                min-height: 350px; 
                line-height: 350px;
                text-align: center;    
            }
            .box3{
                width: 34%;
                background-color:lightgray;
                min-height: 350px; 
                line-height: 350px;
                text-align: center;    
            }
            .footer{
                width: 100%;
                background-color:lightgray;
                min-height: 40px;
                line-height: 40px;
                text-align: center;
            }
        </style>    
    </head>
    <body>
        <div class="main">
            <div class="parent">
                <div class="logo">
                    <h2>Logo</h2>
                </div>
                <div class="navigation">
                    <h2>Navigation</h2>
                </div>
            </div>
            <div class="header">
                <h2>Header/Banner</h2>
            </div>
            <div class="intro">
                <h2>Intro Text Area</h2>
            </div>
            <div class="parent1">
                <div class="box1">
                    <h2>Box 1</h2>
                </div>
                <div class="box2">
                    <h2>Box 2</h2>
                </div>
                <div class="box3">
                    <h2>Box 3</h2>
                </div>
            </div>
            <div class="footer">
                <h2>Footer</h2>
            </div>
        </div>
    </body>
</html>
